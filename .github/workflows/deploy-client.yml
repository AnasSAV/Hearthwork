name: Deploy client

# Builds the static client and publishes it to Cloudflare Pages (project "hearthwork",
# https://hearthwork.anas-hussaindeen.com) on every push to main. The game server deploys itself:
# Render watches the same branch.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The LimeZu-derived art can't be redistributed, so it lives in a private repository
      # (read with a deploy key) and is copied into place for the build.
      - name: Art
        uses: actions/checkout@v7
        with:
          repository: AnasSAV/Hearthwork-art
          ssh-key: ${{ secrets.ART_DEPLOY_KEY }}
          path: .art
      - run: cp -r .art/client . && rm -rf .art
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Public values only (repository variables). Never the service-role key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build -w @focus-town/client
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.45.0 pages deploy client/dist --project-name hearthwork --branch main
          --commit-hash ${{ github.sha }} --commit-message "${{ github.sha }}"
