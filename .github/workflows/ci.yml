name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # SQL integration tests against a throwaway local Supabase stack (Docker is available on
  # GitHub's Ubuntu runners).
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase (database, auth, REST only)
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Write .env files from the local stack
        run: |
          eval "$(supabase status -o env)"
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$API_URL" "$SECRET_KEY" > server/.env
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > client/.env
      - run: npm run test:db
      - run: npm run check:ledger
