# Free Supabase projects pause after a week without activity. One tiny API read a day keeps it
# awake. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (the public publishable key).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/house_levels?select=level&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
